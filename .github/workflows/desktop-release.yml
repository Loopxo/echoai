name: Desktop Release

on:
  workflow_dispatch:

jobs:
  desktop:
    name: Desktop ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-arm64
            runner: macos-14
            package-script: package:mac
          - platform: windows-x64
            runner: windows-2022
            package-script: package:win

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check release inputs
        run: pnpm --filter @echoai/desktop release:check

      - name: Build desktop package
        run: pnpm --filter @echoai/desktop ${{ matrix.package-script }}

      - name: Upload desktop artifacts
        uses: actions/upload-artifact@v4
        with:
          name: echoai-desktop-${{ matrix.platform }}
          path: apps/desktop/release/**
