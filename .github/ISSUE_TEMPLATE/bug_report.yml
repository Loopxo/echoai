name: Bug report
description: Report a problem with EchoAI
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for reporting a bug. Please do not include secrets or API keys.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Exact commands and inputs to reproduce the issue.
      placeholder: |
        1. Run `echoai ...`
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs actual behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Node version, EchoAI version, provider used.
      placeholder: |
        - OS: macOS 15
        - Node: 20.x
        - EchoAI: 2.3.4
        - Provider: deepseek
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant logs or error output (redact secrets).
      render: shell
